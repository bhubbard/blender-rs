[package]
name = "blender-app"
version = "5.2.3"
edition = "2021"
description = "Pure Rust executable runtime engine for Blender 5.2.3 LTS"
license = "GPL-2.0-or-later"

[lib]
path = "src/lib.rs"

[[bin]]
name = "blender"
path = "src/main.rs"

[dependencies]
blender-math = { path = "../blender-math" }
blender-dna = { path = "../blender-dna" }
blender-bmesh = { path = "../blender-bmesh" }
blender-io = { path = "../blender-io" }
blender-obj = { path = "../blender-obj" }
blender-stl = { path = "../blender-stl" }
clap = { version = "4", features = ["derive"] }
colored = "2"
anyhow = "1.0"
eframe = "0.37.0"
